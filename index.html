<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKARA POS</title>
  <!-- Kasa bu sürümden eskiyse Vercel arayüzü yerine paketteki arayüzü açar.
       Arayüz yeni bir electronAPI çağrısına ihtiyaç duyunca bunu o release sürümüne yükseltin. -->
  <meta name="makara-min-shell" content="553.0.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <script>
    (function(){try{if(localStorage.getItem('makara_pos_ui_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
    // Güncelleme yenilemesinde şeffaf pencere bir an masaüstünü göstermesin
    (function(){try{if(sessionStorage.getItem('makara_hot_resume'))document.documentElement.style.background=document.documentElement.classList.contains('dark')?'#141416':'#eef1fb';}catch(e){}})();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
