<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAKARA" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="manifest" href="/manifest.json?v=46.0.0" />
    <link rel="icon" href="/patron.png" />
    <link rel="apple-touch-icon" href="/patron.png" />
    <title>MAKARA</title>
  <script>
    (function () {
      var APP_VERSION = '46.0.0';
      var STORAGE_KEY = 'makara_admin_version';
      function forceUpdate() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) { caches.delete(name); });
          });
        }
        localStorage.setItem(STORAGE_KEY, APP_VERSION);
        setTimeout(function () {
          var clean = window.location.href.split('?')[0].split('#')[0];
          window.location.replace(clean + '?v=' + APP_VERSION + '&t=' + Date.now());
        }, 400);
      }
      if (localStorage.getItem(STORAGE_KEY) !== APP_VERSION) {
        forceUpdate();
        return;
      }
      function check() {
        fetch('/manifest.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (manifest) {
            if (manifest && manifest.version && manifest.version !== localStorage.getItem(STORAGE_KEY)) {
              forceUpdate();
            }
          })
          .catch(function () {});
      }
      check();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) check();
      });
    })();
  </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@380;480;560;650&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
